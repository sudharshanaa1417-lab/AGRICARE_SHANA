services:
  - type: web
    name: agricare-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DEVICE_API_KEY
        value: agricare_live_secret_key_2026
      - key: ENVIRONMENT
        value: production
